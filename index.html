<style>html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>Spooky House Rescue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chewy&family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: a one-screen storybook. Slim top bar, the room as a 16:9 stage, then a talk bubble and the bag of found things.
   One committed night-time look (a silly haunted house), so no light theme. */
:root{
  --night:#17112e; --wall:#2c2152; --plum:#4a2f7a; --moon:#fff3c4; --pumpkin:#ff8a3c; --slime:#9be870; --ghost:#eafff6; --ink:#120c24;
  --display:"Chewy","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
*{box-sizing:border-box}
body{background:var(--night);color:var(--moon);font-family:var(--body);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;
  display:flex;flex-direction:column;gap:8px;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font-family:var(--body);font-weight:800;font-size:1rem;color:var(--ink);background:var(--moon);border:0;border-radius:14px;padding:6px 14px;cursor:pointer;min-height:40px}
button:focus-visible{outline:3px solid var(--slime);outline-offset:2px}
button:active{transform:translateY(2px)}
#bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#bar h1{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:0;color:var(--pumpkin);letter-spacing:.02em;line-height:1}
#where{font-weight:700;color:var(--ghost);opacity:.85}
#stars{margin-left:auto;font-weight:800;color:var(--moon);font-variant-numeric:tabular-nums;white-space:nowrap}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#cv{max-width:100%;max-height:100%;border-radius:18px;background:var(--ink);cursor:pointer;box-shadow:0 0 0 4px var(--plum)}
#low{display:flex;gap:8px;flex-direction:column}
#talk{background:var(--ghost);color:var(--ink);border-radius:16px;padding:8px 14px;font-weight:700;font-size:1.1rem;line-height:1.25;min-height:3.2em;min-width:0}
#talk b{color:#7a2fd0;margin-right:.4em}
#bag{display:flex;gap:8px;align-items:center;overflow-x:auto;min-height:64px;background:var(--wall);border-radius:16px;padding:6px 10px}
#bag .lab{font-weight:800;color:var(--pumpkin);margin-right:4px;white-space:nowrap}
#bag .none{color:var(--ghost);opacity:.6;font-weight:500}
#bag button{background:var(--plum);padding:2px;width:54px;height:54px;min-height:0;border-radius:14px;flex:none;border:3px solid transparent}
#bag button.held{border-color:var(--pumpkin);background:var(--moon)}
#bag button.glow{animation:glow 1s ease-in-out infinite}
#bag canvas{width:44px;height:44px;display:block;margin:auto}
@keyframes glow{50%{box-shadow:0 0 0 5px var(--slime)}}
.over{position:fixed;inset:0;z-index:5;background:rgba(18,12,36,.93);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.card{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;max-width:560px;margin:auto}
.card h2{font-family:var(--display);font-weight:400;font-size:clamp(2rem,8vw,3.4rem);line-height:1;margin:0;color:var(--pumpkin);text-wrap:balance}
.card p{margin:0;font-size:1.1rem;font-weight:500;color:var(--ghost);text-wrap:balance}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pick{background:var(--plum);color:var(--moon);border:3px solid transparent;min-width:128px}
.pick.on{background:var(--moon);color:var(--ink);border-color:var(--pumpkin)}
.pick small{display:block;font-weight:500;font-size:.8rem}
#quizQ{font-family:var(--body);font-weight:800;font-size:clamp(1.4rem,5vw,2.2rem);color:var(--moon);line-height:1.2}
#quizWho{color:var(--pumpkin);font-weight:800}
#quizA button{font-size:1.4rem;min-width:120px;min-height:64px;background:var(--moon)}
#quizA button:disabled{opacity:.35}
#quizMsg{min-height:1.5em;color:var(--slime);font-weight:700}
.go{background:var(--pumpkin);font-size:1.3rem;padding:10px 28px}
@media (max-height:480px){
  .card{gap:6px} .card h2{font-size:1.6rem} #title .card>p:first-of-type{display:none} .card p{font-size:.95rem} .pick small{display:none} .go{font-size:1.1rem;padding:6px 22px}
  body{gap:5px;padding-block:5px}
  #bar h1{display:none} #bar button{min-height:32px;padding:2px 10px;font-size:.9rem}
  #low{flex-direction:row} #talk{flex:1;font-size:.95rem;min-height:0} #bag{flex:none;max-width:50%;min-height:0}
  #bag button{width:44px;height:44px} #bag canvas{width:36px;height:36px} #bag .lab{display:none}
}
@media (prefers-reduced-motion:reduce){#bag button.glow{animation:none;box-shadow:0 0 0 5px var(--slime)}}
</style>
</head>
<body>
<div id="bar">
  <h1>Spooky House Rescue</h1>
  <span id="where"></span>
  <span id="stars"></span>
  <button id="bHint" type="button">Hint</button>
  <button id="bSound" type="button">Sound: on</button>
  <button id="bVoice" type="button">Voice: on</button>
  <button id="bHome" type="button">Home</button>
</div>
<div id="stage"><canvas id="cv" width="1920" height="1080" aria-label="The spooky house. Tap things to explore."></canvas></div>
<div id="low">
  <div id="talk" aria-live="polite"></div>
  <div id="bag" aria-label="Your bag"></div>
</div>

<div class="over" id="title">
  <div class="card">
    <h2>Spooky House Rescue</h2>
    <p>Bernie the dog ran into the silly spooky house on the hill! Explore the rooms, find things, and answer the house friends' questions to bring Bernie home. Nothing in the house can hurt you.</p>
    <p><strong>Who goes first?</strong></p>
    <div class="row">
      <button class="pick" id="whoK" type="button">Kellan</button>
      <button class="pick" id="whoD" type="button">Diana</button>
    </div>
    <p><strong>Pick your level</strong></p>
    <div class="row">
      <button class="pick" id="modeL" type="button">Little<small>Ages 4 to 6. Sparkles show the way.</small></button>
      <button class="pick" id="modeK" type="button">Kid<small>Ages 7 to 12</small></button>
      <button class="pick" id="modeA" type="button">Grown-up<small>Harder questions</small></button>
    </div>
    <div class="row">
      <button class="go" id="bStart" type="button">Start</button>
      <button class="go" id="bCont" type="button" hidden>Keep playing</button>
    </div>
  </div>
</div>
<div class="over" id="quiz" hidden>
  <div class="card">
    <p id="quizWho"></p>
    <h2 id="quizQ"></h2>
    <div class="row" id="quizA"></div>
    <p id="quizMsg" aria-live="polite"></p>
  </div>
</div>
<div class="over" id="win" hidden>
  <div class="card">
    <h2>You found Bernie!</h2>
    <p id="winText"></p>
    <div class="row"><button class="go" id="bAgain" type="button">Play again</button></div>
  </div>
</div>

<script>
"use strict";
const cv=document.getElementById('cv'); let g=cv.getContext('2d');
const W=960,H=540,FLOOR=400,FEET=468,TOTAL=15,SAVE='spooky-house-v1';
const $=id=>document.getElementById(id);
const ITEMS={goldkey:'gold key',lantern:'lantern',stool:'stool',cookie:'cookie',cheese:'cheese',bone:'bone',starkey:'star key',teddy:'teddy bear',moonkey:'moon key'};
const ORDER=['red','blue','yellow'];
const BOOKS=[['green','#4fbf6b',300],['yellow','#ffd23f',370],['red','#e8483f',440],['purple','#a56be0',510],['blue','#4a8df0',580]];

/* ---------- state ---------- */
let s=null, t=0, voiceOn=true, pickWho='k', pickMode='little';
const p={x:100,dir:1,ph:0}, fol={x:60,dir:1,ph:0};
let target=null, pending=null, fade=0, hintUntil=0, fx=[], wave={}, winAt=0;
const fresh=(who,mode)=>({room:'yard',inv:[],f:{},held:null,stars:0,who,mode,seq:0,won:false,q:{},asked:[],right:0});
const has=i=>s.inv.includes(i);
function persist(){ try{ localStorage.setItem(SAVE,JSON.stringify({s,voiceOn})); }catch(e){} }
function loadSave(){ try{ const d=JSON.parse(localStorage.getItem(SAVE)||'null'); if(d&&d.s&&ROOMS[d.s.room]) return d; }catch(e){} return null; }

/* ---------- sound and voice ---------- */
/* All sounds are made here with simple beeps, like a 1990 PC. The tunes are original, written for this game. */
let ac=null, soundOn=true, sfxG=null, musG=null, noiseBuf=null, sfxCount=0;
function audio(){ if(ac) return ac; try{ ac=new (window.AudioContext||window.webkitAudioContext)(); sfxG=ac.createGain(); sfxG.gain.value=.55; sfxG.connect(ac.destination); musG=ac.createGain(); musG.gain.value=.5; musG.connect(ac.destination);
  noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate); const d=noiseBuf.getChannelData(0); for(let k=0;k<d.length;k++) d[k]=Math.random()*2-1; }catch(e){ ac=null; } return ac; }
function tone(o){ if(!soundOn||!audio()) return; try{ const at=o.t||ac.currentTime+(o.at||0), d=o.d||.15, os=ac.createOscillator(), v=ac.createGain(); os.type=o.type||'square'; os.frequency.setValueAtTime(o.f,at); if(o.f2) os.frequency.exponentialRampToValueAtTime(o.f2,at+d);
  if(o.vib){ const l=ac.createOscillator(), lg=ac.createGain(); l.frequency.value=o.vib; lg.gain.value=o.f*.05; l.connect(lg); lg.connect(os.frequency); l.start(at); l.stop(at+d+.05); }
  v.gain.setValueAtTime(.0001,at); v.gain.linearRampToValueAtTime(o.v||.1,at+.012); v.gain.exponentialRampToValueAtTime(.0001,at+d); os.connect(v); v.connect(o.out||sfxG); os.start(at); os.stop(at+d+.05); }catch(e){} }
function noise(o){ if(!soundOn||!audio()) return; try{ const at=ac.currentTime+(o.at||0), d=o.d||.1, src=ac.createBufferSource(), bp=ac.createBiquadFilter(), v=ac.createGain(); src.buffer=noiseBuf; bp.type='bandpass'; bp.frequency.value=o.f; bp.Q.value=1.2;
  v.gain.setValueAtTime(o.v||.2,at); v.gain.exponentialRampToValueAtTime(.0001,at+d); src.connect(bp); bp.connect(v); v.connect(sfxG); src.start(at); src.stop(at+d+.05); }catch(e){} }
function beep(notes){ notes.forEach((f,k)=>tone({f,d:.16,v:.07,at:k*.1})); }
const SFX={
 door(){ tone({type:'sawtooth',f:70,f2:150,d:.5,v:.07,vib:11}); noise({f:300,d:.09,v:.3,at:.5}); },
 lock(){ noise({f:2500,d:.04,v:.3}); tone({f:1200,d:.05,v:.06,at:.07}); },
 step(){ noise({f:170,d:.05,v:.1}); },
 owl(){ tone({type:'sine',f:420,f2:380,d:.22,v:.2}); tone({type:'sine',f:420,f2:340,d:.42,v:.2,at:.3}); },
 ghost(){ tone({type:'sine',f:480,f2:800,d:.45,v:.13,vib:7}); tone({type:'sine',f:800,f2:420,d:.6,v:.13,vib:7,at:.45}); },
 ghost2(){ tone({type:'sine',f:800,f2:1300,d:.3,v:.1,vib:9}); tone({type:'sine',f:1300,f2:900,d:.35,v:.1,vib:9,at:.3}); },
 squeak(){ tone({f:2200,f2:3000,d:.07,v:.05}); tone({f:2400,f2:3200,d:.07,v:.05,at:.13}); },
 purr(){ for(let k=0;k<12;k++) tone({type:'sawtooth',f:58,d:.06,v:.1,at:k*.07}); },
 spider(){ for(let k=0;k<8;k++) tone({type:'triangle',f:900+k*90,d:.04,v:.1,at:k*.05}); },
 clank(){ tone({f:523,d:.25,v:.05}); tone({f:789,d:.2,v:.05}); tone({f:1217,d:.12,v:.04}); noise({f:4000,d:.05,v:.2}); },
 boing(){ tone({type:'sine',f:180,f2:700,d:.18,v:.2}); tone({type:'sine',f:700,f2:260,d:.3,v:.16,at:.18,vib:18}); },
 monster(){ tone({type:'sawtooth',f:110,f2:80,d:.35,v:.1,vib:14}); tone({type:'sawtooth',f:140,f2:100,d:.3,v:.1,vib:14,at:.32}); },
 bark(){ for(let k=0;k<2;k++){ tone({type:'sawtooth',f:520,f2:260,d:.12,v:.14,at:k*.22}); noise({f:900,d:.08,v:.15,at:k*.22}); } },
 rumble(){ noise({f:90,d:1,v:.5}); tone({type:'sawtooth',f:50,f2:40,d:1,v:.1,vib:9}); }
};
const WHO_SFX={'Owl':'owl','Boo the ghost':'ghost','Baby ghost':'ghost2','Mouse':'squeak','Fuzzy':'monster','Fuzzy under the bed':'monster'};
function sfx(n){ sfxCount++; if(SFX[n]) SFX[n](); }
/* music: each voice is a list of notes, one step long unless marked like A4:2. "-" is a rest. */
const NOTE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const tune=str=>str.split(' ').map(k=>{ const [n,l]=k.split(':'), len=+(l||1); if(n==='-') return [0,len]; const m=/^([A-G])(#?)(\d)$/.exec(n); return [440*Math.pow(2,(NOTE[m[1]]+(m[2]?1:0)+(m[3]-4)*12-9)/12),len]; });
const TRACKS={
 title:{u:.2,v:[['square',.04,tune('A4 C5 E5 C5 A4 C5 E5 - G#4 B4 E5 B4 G#4 B4 E5 - A4 C5 E5 A5 G5 E5 C5 E5 D5 F5 E5 D5 C5 B4 A4 - F4 A4 C5 A4 F4 A4 C5 - E4 G#4 B4 G#4 E4 G#4 B4 - A4 B4 C5 D5 E5 F5 E5 D5 C5 A4 B4 G#4 A4:2 -:2')],
   ['triangle',.09,tune('A2:2 E3:2 A2:2 E3:2 E2:2 B2:2 E2:2 B2:2 A2:2 E3:2 C3:2 E3:2 D3:2 E3:2 A2:2 E2:2 F2:2 C3:2 F2:2 C3:2 E2:2 B2:2 E2:2 B2:2 A2:2 C3:2 D3:2 E3:2 A2:2 E2:2 A2:4')]]},
 sneak:{u:.27,st:.55,v:[['square',.035,tune('D4 - F4 - A4 - G#4 - A4 F4 D4 - C#4:2 -:2 D4 - F4 - A4 - A#4 - A4 G4 F4 E4 D4:2 -:2')],
   ['triangle',.09,tune('D3:4 -:4 A2:4 -:4 D3:4 -:4 A2:2 C#3:2 D3:4')]]},
 creep:{u:.36,v:[['triangle',.11,tune('E3:2 G3:2 F#3:4 E3:2 A#3:2 A3:4 E3:2 G3:2 B3:2 A#3:2 A3:2 F#3:2 E3:4')],
   ['square',.02,tune('-:6 B5 E6 -:6 A#5 E6 -:6 B5 G6 -:4 E6:2 -:2')]]},
 tiptoe:{u:.24,st:.6,v:[['square',.035,tune('D5 - A#4 - G4 - A#4 - D5 D5 C5 A#4 A4:2 -:2 C5 - A4 - F#4 - A4 - C5 C5 A#4 A4 G4:2 -:2')],
   ['triangle',.09,tune('G2:2 D3:2 G2:2 D3:2 G2:2 D3:2 D3:2 D2:2 D2:2 A2:2 D2:2 A2:2 D2:2 A2:2 G2:2 G2:2')]]},
 win:{u:.17,v:[['square',.04,tune('C5 E5 G5 C6 G5 E5 G5 - A4 C5 F5 A5 F5 C5 F5 - G4 B4 D5 G5 D5 B4 D5 - C5 E5 G5 E5 C5:2 -:2')],
   ['triangle',.09,tune('C3:2 G3:2 C3:2 G3:2 F2:2 C3:2 F2:2 C3:2 G2:2 D3:2 G2:2 D3:2 C3:2 G2:2 C3:4')]]}
};
const MUSIC={yard:'title',hall:'sneak',kitchen:'sneak',library:'sneak',cellar:'creep',upstairs:'tiptoe',bedroom:'tiptoe',attic:'tiptoe'};
const mus={name:null,pos:[],next:[]};
function setMusic(name){ if(mus.name===name||!TRACKS[name]) return; mus.name=name; mus.pos=TRACKS[name].v.map(()=>0); mus.next=TRACKS[name].v.map(()=>0); }
function pump(){ if(!ac||!soundOn||!mus.name||ac.state!=='running') return; const tr=TRACKS[mus.name], now=ac.currentTime;
  if(mus.next.some(x=>x<now-.25)){ mus.pos=tr.v.map(()=>0); mus.next=tr.v.map(()=>now+.1); }
  tr.v.forEach((vc,k)=>{ while(mus.next[k]<now+.35){ const [f,len]=vc[2][mus.pos[k]]; if(f) tone({type:vc[0],f,d:len*tr.u*(tr.st||.9),v:vc[1],t:mus.next[k],out:musG}); mus.next[k]+=len*tr.u; mus.pos[k]=(mus.pos[k]+1)%vc[2].length; } }); }
setInterval(pump,100);
function wake(){ if(soundOn&&audio()&&ac.state==='suspended') ac.resume().catch(()=>{}); }
addEventListener('pointerdown',wake,true); addEventListener('keydown',wake,true);
document.addEventListener('visibilitychange',()=>{ if(!ac) return; if(document.hidden){ ac.suspend().catch(()=>{}); try{ speechSynthesis.cancel(); }catch(e){} } else wake(); });
function speak(txt){ if(!voiceOn) return; try{ const ss=window.speechSynthesis; if(!ss) return; ss.cancel(); const u=new SpeechSynthesisUtterance(txt); u.rate=.9; u.pitch=1.15; u.lang='en-US'; ss.speak(u); }catch(e){} }
function say(txt,who){ if(WHO_SFX[who]) sfx(WHO_SFX[who]); const el=$('talk'); el.textContent=''; if(who){ const b=document.createElement('b'); b.textContent=who+':'; el.appendChild(b); } el.appendChild(document.createTextNode(txt)); speak(txt); }

/* ---------- items ---------- */
function star(){ s.stars++; beep([660,880,1100]); for(let i=0;i<14;i++) fx.push({x:p.x,y:FEET-90,vx:(Math.random()-.5)*260,vy:-Math.random()*260-60,life:1,c:['#fff3c4','#ff8a3c','#9be870'][i%3]}); }
function give(i,msg){ s.inv.push(i); star(); say(msg); }
function take(i){ s.inv=s.inv.filter(x=>x!==i); if(s.held===i) s.held=null; }
/* true = use it now, false = you do not have it, null = you have it but have not picked it (Kid and Grown-up levels) */
function use(i){ if(!has(i)) return false; if(s.mode==='little'||s.held===i) return true;
  say(s.held?'That does not work here. Try something else from your bag.':'Pick something from your bag, then tap here again.'); return null; }
function go(to,at){ s.room=to; p.x=at; fol.x=at-40; target=null; pending=null; fade=1; sfx('door'); setMusic(MUSIC[to]); $('where').textContent=ROOMS[to].name; say(ROOMS[to].hello); }

/* ---------- rooms: what you can tap ---------- */
const ROOMS={
 yard:{name:'Front yard',hello:'The front yard. The house looks silly and spooky!',hs:[
  {id:'owl',r:[190,165,90,90],tap(){ wave.owl=t; say('Hoo hoo! Bernie ran into the house. Go and find him!','Owl'); }},
  {id:'mailbox',r:[345,300,80,130],tap(){ say('A note in the mailbox says: Come in and play! Love, Boo the ghost.'); }},
  {id:'pot',r:[550,340,85,95],wx:560,tap(){ if(!s.f.key1){ s.f.key1=1; give('goldkey','You found a gold key under the flowerpot!'); } else say('What a pretty flower.'); }},
  {id:'door',r:[650,280,100,145],wx:700,to:'hall',at:150,open:()=>s.f.doorOpen,tap(){ const u=use('goldkey'); if(u===null) return;
     if(u) ask('door','The door knocker',()=>{ take('goldkey'); s.f.doorOpen=1; star(); sfx('lock'); say('Click! The door is open. Tap the door to go inside.'); }); else say('The door is locked. Is a key hiding in the yard?'); }}
 ]},
 hall:{name:'Hall',hello:'The big hall. Doors go to the kitchen and the library.',hs:[
  {id:'out',r:[0,320,74,150],wx:50,to:'yard',at:700},
  {id:'kdoor',r:[115,190,100,215],wx:165,to:'kitchen',at:150},
  {id:'ldoor',r:[755,190,100,215],wx:805,to:'library',at:150},
  {id:'painting',r:[625,160,115,110],wx:680,tap(){ s.f.saw=1; say('The painting shows three books. Red, then blue, then yellow.'); }},
  {id:'stairs',r:[400,150,200,255],wx:500,to:'upstairs',at:150,open:()=>s.f.ghostFed,tap(){ say('I am on the stairs and I am SO hungry! Do you have a cookie?','Boo the ghost'); }},
  {id:'lantern',r:[280,270,90,135],wx:320,show:()=>!s.f.lantern,tap(){ s.f.lantern=1; give('lantern','You took the lantern. Now you can go into dark places!'); }},
  {id:'ghost',r:[450,240,120,160],wx:400,show:()=>!s.f.ghostFed,tap(){ const u=use('cookie'); if(u===null) return;
     if(u) ask('ghost','Boo the ghost',()=>{ take('cookie'); s.f.ghostFed=1; star(); say('Yum yum! Thank you! You can go up the stairs now.','Boo the ghost'); }); else say('I am SO hungry! Please bring me a cookie!','Boo the ghost'); }},
  {id:'boo',r:[300,90,110,120],wx:355,show:()=>s.f.ghostFed,tap(){ wave.boo=t; say('Hee hee! Bernie is way up in the attic.','Boo the ghost'); }}
 ]},

/* ---------- the helper: what to do next ---------- */
const HINTS={'yard:pot':'Look under the flowerpot by the door.','yard:door':'Use the gold key on the front door.','hall:lantern':'Take the lantern from the table in the hall.',
 'library:stool':'There is a stool in the library.','kitchen:jar':'Use the stool to reach the cookie jar in the kitchen.','hall:ghost':'Give the cookie to Boo the ghost on the stairs.',
 'kitchen:fridge':'Look in the fridge in the kitchen.','cellar:barrel':'Look in the barrel down in the cellar.','cellar:mouse':'Give the cheese to the mouse in the cellar.',
 'library:book':'In the library, tap the books in this order: red, blue, yellow.','library:cupboard':'Look in the secret cupboard in the library.','bedroom:monster':'Give the teddy bear to the monster under the bed, upstairs.',
 'upstairs:attic':'Use your keys on the attic door upstairs.','attic:trunk':'Give the bone to Bernie behind the trunk.'};
function nextStep(){ const f=s.f;
  if(!f.key1) return ['yard','pot']; if(!f.doorOpen) return ['yard','door','goldkey']; if(!f.lantern) return ['hall','lantern'];
  if(!f.stool) return ['library','stool']; if(!f.cookie) return ['kitchen','jar','stool']; if(!f.ghostFed) return ['hall','ghost','cookie'];
  if(!f.cheese) return ['kitchen','fridge']; if(!f.bone) return ['cellar','barrel']; if(!f.starkey) return ['cellar','mouse','cheese'];
  if(!f.secretOpen) return ['library','book_'+ORDER[s.seq]]; if(!f.teddy) return ['library','cupboard']; if(!f.moonkey) return ['bedroom','monster','teddy'];
  if(!f.aStar) return ['upstairs','attic','starkey']; if(!f.aMoon) return ['upstairs','attic','moonkey']; if(!s.won) return ['attic','trunk','bone']; return null; }
function hint(){ const n=nextStep(); if(!n) return null; const [room,id,item]=n;
  if(s.room!==room){ const prev={[s.room]:null}, q=[s.room];
    while(q.length){ const r=q.shift(); for(const h of ROOMS[r].hs) if(h.to&&!(h.to in prev)&&(!h.open||h.open())){ prev[h.to]=[r,h.id]; q.push(h.to); } }
    if(!(room in prev)) return null; let cur=room; while(prev[cur][0]!==s.room) cur=prev[cur][0]; return {id:prev[cur][1]}; }
  if(item&&s.mode!=='little'&&s.held!==item) return {id,inv:item}; return {id}; }
function hintText(){ const n=nextStep(); if(!n) return 'You did it!'; return HINTS[n[0]+':'+(n[1].startsWith('book_')?'book':n[1])]; }

let quiz=null;
function ask(key,who,done){ if(s.q[key]){ done(); return; }
  const bank=QUIZ[s.mode]||QUIZ.little; let pool=bank.map((_,i)=>i).filter(i=>!s.asked.includes(i)); if(!pool.length){ s.asked=[]; pool=bank.map((_,i)=>i); }
  const qi=pool[Math.floor(Math.random()*pool.length)], [q,a,b,c,sp]=bank[qi];
  const opts=[{a,ok:true},{a:b},{a:c}].sort(()=>Math.random()-.5); quiz={key,qi,done,opts};
  $('quizWho').textContent=who+' asks a question first:'; $('quizQ').textContent=q; $('quizMsg').textContent=''; const box=$('quizA'); box.textContent='';
  opts.forEach((o,i)=>{ const btn=document.createElement('button'); btn.type='button'; btn.id='quiz-'+i; btn.textContent=o.a; btn.onclick=()=>answer(i); box.appendChild(btn); });
  $('quiz').hidden=false; speak((sp||q)+' Is it '+opts[0].a+', '+opts[1].a+', or '+opts[2].a+'?'); }
function answer(i){ if(!quiz) return false; const o=quiz.opts[i];
  if(!o.ok){ const btn=$('quiz-'+i); if(btn) btn.disabled=true; beep([220,180]); $('quizMsg').textContent='Not quite. Try again!'; speak('Not quite. Try again!'); return false; }
  s.q[quiz.key]=1; s.asked.push(quiz.qi); s.right++; $('quiz').hidden=true; const d=quiz.done; quiz=null; d(); renderBag(); renderBar(); persist(); return true; }

/* ---------- acting on a tap ---------- */
const shown=h=>!h.show||h.show();
const hot=id=>ROOMS[s.room].hs.find(h=>h.id===id);
function fire(h){ if(!shown(h)) return false; if(h.to&&(!h.open||h.open())) go(h.to,h.at); else if(h.tap) h.tap(); renderBag(); renderBar(); persist(); return true; }
function clickAt(x,y){ if(!s||fade>.5) return; const hs=ROOMS[s.room].hs; let h=null;
  for(let i=hs.length-1;i>=0;i--){ const [a,b,c,d]=hs[i].r; if(shown(hs[i])&&x>=a&&x<=a+c&&y>=b&&y<=b+d){ h=hs[i]; break; } }
  const wx=h?(h.wx??h.r[0]+h.r[2]/2):x; target=Math.max(50,Math.min(900,wx)); pending=h; }
cv.addEventListener('pointerdown',e=>{ const r=cv.getBoundingClientRect(); clickAt((e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H); });
const keys={}; addEventListener('keydown',e=>{ if(e.key==='ArrowLeft'||e.key==='ArrowRight'){ keys[e.key]=1; pending=null; e.preventDefault(); } }); addEventListener('keyup',e=>{ delete keys[e.key]; });

function update(dt){ t+=dt; if(!s) return; if(fade>0) fade=Math.max(0,fade-dt*2.5);
  if(keys.ArrowLeft) target=Math.max(50,p.x-30); else if(keys.ArrowRight) target=Math.min(900,p.x+30);
  if(target!==null){ const dx=target-p.x, st=300*dt;
    if(Math.abs(dx)<=st){ p.x=target; target=null; if(pending){ const h=pending; pending=null; fire(h); } }
    else { const a=Math.floor(p.ph/Math.PI); p.dir=dx>0?1:-1; p.x+=p.dir*st; p.ph+=dt*13; if(Math.floor(p.ph/Math.PI)!==a) sfx('step'); } } else p.ph=0;
  const want=p.x-58*p.dir, fd=want-fol.x; if(Math.abs(fd)>4){ fol.dir=fd>0?1:-1; fol.x+=Math.sign(fd)*Math.min(Math.abs(fd),260*dt); fol.ph+=dt*13; } else { fol.ph=0; fol.dir=p.dir; }
  for(const q of fx){ q.x+=q.vx*dt; q.y+=q.vy*dt; q.vy+=500*dt; q.life-=dt; } fx=fx.filter(q=>q.life>0);
  if(s.won&&Math.random()<dt*14) fx.push({x:Math.random()*W,y:-10,vx:(Math.random()-.5)*60,vy:60+Math.random()*80,life:3,c:['#ff8a3c','#9be870','#fff3c4','#a56be0','#4a8df0'][Math.floor(Math.random()*5)]});
  if(winAt&&t>=winAt){ winAt=0; showWin(); } }

  const other=s.who==='k'?'d':'k';
  if(s.room==='attic'&&s.won) dog(470,FEET-Math.abs(Math.sin(t*8))*14,p.x<470?-1:1,1);
  kid(fol.x,other,fol.dir,fol.ph); kid(p.x,s.who,p.dir,p.ph);
  if(s.room==='cellar'){ drawItem('lantern',p.x+26*p.dir,FEET-46,34); }
  for(const q of fx){ g.globalAlpha=Math.min(1,q.life); starShape(q.x,q.y,7,q.c,q.x*.05); } g.globalAlpha=1;
  if(fade>0){ g.fillStyle='rgba(18,12,36,'+fade+')'; g.fillRect(0,0,W,H); } }

/* ---------- bar, bag, screens ---------- */
function renderBar(){ $('stars').textContent='★ '+(s?s.stars:0)+' of '+TOTAL; $('where').textContent=s?ROOMS[s.room].name:''; $('bVoice').textContent='Voice: '+(voiceOn?'on':'off'); $('bSound').textContent='Sound: '+(soundOn?'on':'off'); }
function renderBag(){ const bag=$('bag'); bag.textContent=''; const lab=document.createElement('span'); lab.className='lab'; lab.textContent='Bag'; bag.appendChild(lab);
  if(!s||!s.inv.length){ const n=document.createElement('span'); n.className='none'; n.textContent='Nothing yet. Tap things in the room to look for stuff.'; bag.appendChild(n); return; }
  const hi=(s.mode==='little'||t<hintUntil)?hint():null;
  for(const i of s.inv){ const b=document.createElement('button'); b.type='button'; b.id='bag-'+i; b.title=ITEMS[i]; b.setAttribute('aria-label',ITEMS[i]); b.setAttribute('aria-pressed',s.held===i);
    if(s.held===i) b.className='held'; if(hi&&hi.inv===i) b.classList.add('glow');
    const c=document.createElement('canvas'); c.width=88; c.height=88; const keep=g; g=c.getContext('2d'); drawItem(i,44,44,76); g=keep; b.appendChild(c);
    b.onclick=()=>{ s.held=s.held===i?null:i; beep([520]); say(s.held?'You are holding the '+ITEMS[i]+'. Now tap where you want to use it.':'You put the '+ITEMS[i]+' back in your bag.'); renderBag(); };
    bag.appendChild(b); } }
function setPicks(){ $('whoK').classList.toggle('on',pickWho==='k'); $('whoD').classList.toggle('on',pickWho==='d'); $('modeL').classList.toggle('on',pickMode==='little'); $('modeK').classList.toggle('on',pickMode==='kid'); $('modeA').classList.toggle('on',pickMode==='adult'); }
function begin(state){ s=state; p.x=s.room==='yard'&&!s.stars?100:p.x; fol.x=p.x-58; target=null; pending=null; fx=[]; winAt=0; $('title').hidden=true; $('win').hidden=true; $('quiz').hidden=true; quiz=null; setMusic(s.won?'win':MUSIC[s.room]); renderBag(); renderBar();
  say(s.stars?ROOMS[s.room].hello:'Oh no! Bernie the dog ran into the spooky house. Let us find him! Tap things to look around.'); persist(); }
function showTitle(){ $('quiz').hidden=true; $('win').hidden=true; winAt=0; quiz=null; setMusic('title'); $('bCont').hidden=!(loadSave()&&!loadSave().s.won); setPicks(); $('title').hidden=false; try{ speechSynthesis.cancel(); }catch(e){} }
function showWin(){ $('winText').textContent='Great job, '+(s.who==='k'?'Kellan and Diana':'Diana and Kellan')+'! You got all '+s.stars+' stars, answered '+s.right+' questions, and made friends with everyone in the house.'; $('win').hidden=false; speak('Hooray! You found Bernie!'); persist(); }
$('whoK').onclick=()=>{ pickWho='k'; setPicks(); }; $('whoD').onclick=()=>{ pickWho='d'; setPicks(); };
$('modeL').onclick=()=>{ pickMode='little'; setPicks(); }; $('modeK').onclick=()=>{ pickMode='kid'; setPicks(); }; $('modeA').onclick=()=>{ pickMode='adult'; setPicks(); };
$('bStart').onclick=()=>{ p.x=100; begin(fresh(pickWho,pickMode)); };
$('bCont').onclick=()=>{ const d=loadSave(); if(d){ p.x=200; begin(d.s); } };
$('bAgain').onclick=()=>{ s=null; fx=[]; renderBar(); renderBag(); say(''); showTitle(); };
$('bHome').onclick=()=>{ if(s) persist(); showTitle(); };
$('bVoice').onclick=()=>{ voiceOn=!voiceOn; if(!voiceOn){ try{ speechSynthesis.cancel(); }catch(e){} } renderBar(); if(s) persist(); };
$('bSound').onclick=()=>{ soundOn=!soundOn; if(soundOn){ wake(); beep([660,880]); } renderBar(); try{ localStorage.setItem(SAVE+'-sound',soundOn?'1':'0'); }catch(e){} };
$('bHint').onclick=()=>{ if(!s||s.won) return; hintUntil=t+8; say(hintText(),'Hint'); renderBag(); };

/* ---------- start ---------- */
try{ soundOn=localStorage.getItem(SAVE+'-sound')!=='0'; }catch(e){}
(function(){ const d=loadSave(); if(d){ voiceOn=d.voiceOn!==false; pickWho=d.s.who; pickMode=d.s.mode; } })();
let last=0; function loop(ms){ const dt=Math.min(.05,(ms-last)/1000||0); last=ms; update(dt); draw(); requestAnimationFrame(loop); }
window.__SH={get s(){return s;},ROOMS,p,hint,nextStep,update,draw,clickAt,act:id=>{ const h=hot(id); return h?fire(h):false; },begin,fresh,get quiz(){return quiz;},get music(){return mus.name;},get sfxCount(){return sfxCount;},TRACKS,answer,QUIZ,hold:i=>{ s.held=i; },TOTAL};
try{ window.claude?.hot?.snapshot?.(()=>({s,voiceOn})); }catch(e){}
renderBar(); renderBag(); showTitle(); requestAnimationFrame(loop);
if('serviceWorker' in navigator&&location.protocol.startsWith('http')&&!/claude/.test(location.hostname)) addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
</script>
